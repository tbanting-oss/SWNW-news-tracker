name: Signal scan (rolling log build)

on:
  schedule:
    # Runs ~30 min after each feed build so the feed JSON is fresh.
    # 06:00 UTC - morning scan (feed built 05:30)
    - cron: "0 6 * * *"
    # 15:00 UTC - afternoon / US-business-day scan (feed built 14:30)
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # manual run from the Actions tab

# Prevent the two daily runs (or a manual + scheduled) from racing on the commit.
concurrency:
  group: signal-scan
  cancel-in-progress: false

permissions:
  contents: write   # commit the rendered log back to the repo
  issues: write     # needed for the failure alert (opens/updates a health issue)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: pin or change the model without editing the script.
          # ANTHROPIC_MODEL: claude-sonnet-4-5
        run: python scripts/signal_scan.py

      - name: Commit rolling log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/log-data.json docs/index.html
          git diff --staged --quiet && echo "No changes" || git commit -m "Signal scan: rolling log update"
          git pull --rebase origin main
          git push

      # Fires only if an earlier step failed (e.g. missing API key, or the feed JSON
      # is missing/stale). Opens/updates the shared 'pipeline-health' issue so GitHub
      # emails you. Built-in token — no SMTP secret needed.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- swnw-health -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n**${context.workflow}** failed.\nRun: ${runUrl}\nCommit: \`${context.sha.slice(0,7)}\`\nWhen: ${new Date().toISOString()}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'pipeline-health' });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: '🔴 SWNW signal-scan degraded', body, labels: ['pipeline-health'] });
            }
