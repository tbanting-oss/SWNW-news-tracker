name: Daily feed aggregation (UC/CCaaS/CPaaS/CX signal scan sources)

on:
  schedule:
    # 05:30 UTC - ahead of the 08:30 UTC morning signal scan
    - cron: "30 5 * * *"
    # 14:30 UTC - ahead of the ~15:38 UTC afternoon (US-business-day) scan,
    # so US-morning press releases (from ~13:00 UTC) are in the feed before the run.
    - cron: "30 14 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write   # needed to commit the consolidated JSON back to the repo
  issues: write     # needed for the failure alert (opens/updates a health issue)

jobs:
  fetch-all-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch, filter, consolidate
        env:
          BUSINESSWIRE_RSS_URL: ${{ secrets.BUSINESSWIRE_RSS_URL }}
        run: python scripts/fetch_all_feeds.py

      - name: Commit consolidated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/all-feeds-filtered.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Daily feed aggregation run"
          git pull --rebase origin main
          git push

      # Fires only if an earlier step failed (e.g. the fetcher's health guard exited
      # non-zero). Opens a 'pipeline-health' issue, or comments on the open one, so
      # GitHub emails you. Uses the built-in token — no SMTP secret needed.
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- swnw-health -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n**${context.workflow}** failed.\nRun: ${runUrl}\nCommit: \`${context.sha.slice(0,7)}\`\nWhen: ${new Date().toISOString()}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'pipeline-health' });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: '🔴 SWNW feed pipeline degraded', body, labels: ['pipeline-health'] });
            }
